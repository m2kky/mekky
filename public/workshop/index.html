</style></head><body><main class="deck" data-slide="0" data-theme="cover" aria-label="Personal branding presenter deck"><section class="slide cover active" aria-label="Cover" aria-hidden="false">
 <img class="portrait" src="assets/mekky-reference-portrait-v2.png" alt="AI portrait of Muhammed Mekky looking upward in sunglasses, with orange cinematic lighting">
 <header class="top"><div class="brand"><span class="brand-art brand-full"><img src="assets/brand/Logo.png" alt="Muhammed Mekky" width="1672" height="940"></span></div><span class="middle">AI-POWERED PERSONAL BRANDING</span><span class="tag">SEEN FORUM / WORKSHOP</span></header>
 <div class="cover-content"><p class="eyebrow reveal">YOUR IDEAS. YOUR VOICE. AMPLIFIED.</p><h1 class="reveal delay"><span>CREATE MORE.</span><span>STAY</span><span>YOU.</span></h1><p class="intro reveal delay2">Build a personal brand with AI.<br>Start with what makes you, you.</p></div>
 <div class="speaker reveal delay2"><strong>Muhammed Mekky</strong><span>Artist. Digital Problem Solver.<br>Strategist + Builder.</span></div>
 <div class="hint">USE ← → TO EXPLORE</div>
</section></main><script>/* Presenter deck. Prompts are copied on explicit action, never rendered in a slide. */
const icons={
person:'<circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/>',
people:'<circle cx="9" cy="7" r="3"/><path d="M2 21v-3a7 7 0 0 1 14 0v3M16 4a3 3 0 0 1 0 6m3 4a6 6 0 0 1 3 5v2"/>',
spark:'<path d="m12 2 2.7 7.3L22 12l-7.3 2.7L12 22l-2.7-7.3L2 12l7.3-2.7Z"/>',
target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
pen:'<path d="m15 3 6 6M3 21l5-1L21 7a2 2 0 0 0-4-4L4 16Z"/>',
check:'<path d="m5 12 4 4L19 6"/><circle cx="12" cy="12" r="10"/>',
message:'<path d="M21 4H3v14h5l4 4v-4h9ZM7 9h10M7 13h6"/>',
brain:'<path d="M12 4c-3-5-8-1-7 3-5 1-4 8 0 8-1 5 5 8 7 4 2 4 8 1 7-4 4 0 5-7 0-8 1-4-4-8-7-3Zm0 0v15M5 7l3 2m11-2-3 2M5 15l3-2m11 2-3-2"/>',
light:'<path d="M8 17c0-3-4-3-4-8a8 8 0 0 1 16 0c0 5-4 5-4 8ZM9 21h6M9 17h6"/>',
fork:'<path d="M12 22V12M12 12 4 4M12 12l8-8M12 12V2M1 4h4v4M19 8V4h4M9 3l3-2 3 2"/>',
loop:'<path d="M20 8a9 9 0 0 0-15-3L2 8m0-6v6h6m-4 8a9 9 0 0 0 15 3l3-3m0 6v-6h-6"/>',
file:'<path d="M14 2H4v20h16V8ZM14 2v6h6M8 12h8M8 16h8"/>',
eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12Z"/><circle cx="12" cy="12" r="3"/>',

cup:'<path d="M3 7h14v8a6 6 0 0 1-6 6H9a6 6 0 0 1-6-6Zm14 1h2a3 3 0 1 1 0 6h-2M6 2v2M11 1v3"/>',
question:'<circle cx="12" cy="12" r="10"/><path d="M9 8a3 3 0 1 1 5 2l-2 2v2M12 17v.2"/>',

steps:'<path d="M2 21h7v-6h6V9h7V3M2 15h3M8 9h3M14 3h3"/>',

arrow:'<path d="M3 12h18m-6-6 6 6-6 6"/>'};
const I=(name,extra='')=>`<svg class="icon ${extra}" aria-hidden="true" viewBox="0 0 24 24">${icons[name]||icons.spark}</svg>`;
const head=(chapter,tag,full=false)=>`<header class="top"><div class="brand">${full?'<span class="brand-art brand-full"><img src="assets/brand/Logo.png" alt="Muhammed Mekky" width="1672" height="940"></span>':'<span class="brand-art brand-compact"><img src="assets/brand/Compact.png" alt="Muhammed Mekky" width="1672" height="940"></span>'}</div><span class="middle">${chapter}</span><span class="tag">${tag}</span></header>`;
const node=(icon,title,text,i)=>`<div class="node" style="--i:${i}">${I(icon)}<h3>${title}</h3><p>${text}</p><span class="number">0${i+1}</span></div>`;
const timer=(seconds)=>`<div class="exercise-bar"><div class="time-group"><span class="countdown">${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}</span><button class="timer-toggle" data-seconds="${seconds}" type="button">${I('clock')}<span>Start timer</span></button></div></div>`;
const prompts={
interview:`Act as a thoughtful personal-brand interviewer. Interview me to discover my positioning; do not invent an identity for me. Ask ONE question at a time, wait for my answer, and ask up to 6 questions covering: skills I have actually used, a concrete example of my work, who I can help, a problem they face, the result I can support, and what is different about my perspective. If an answer is vague, ask for an example. Do not invent achievements, client results or numbers. Distinguish confirmed facts from assumptions. After the interview, offer 2 draft positioning statements in the form “I help [specific audience] solve [problem] through [approach]”, explain the difference, and ask me to correct them. Keep the wording natural. First ask which language I want to use.`,
voice:`Help me capture my real voice for personal-brand content. Ask me, ONE question at a time, for (1) a real moment from my work, (2) a point of view I hold and why, and (3) a short sample of how I actually speak or write. Do not invent experiences, achievements or quotes. Then extract a brief voice guide: tone, typical phrasing, useful details, claims to avoid, and 3 writing rules. Label uncertain interpretations as assumptions and let me correct them. Preserve my chosen language or dialect. Do not turn my voice into generic motivational or corporate copy.`,
persona:`Use the positioning we confirmed in this conversation to help me describe ONE audience. Ask me who the audience is if it is missing; do not invent customer research. Produce a short audience hypothesis with: their situation, one specific desired outcome, their main frustration, what blocks them, a question they might ask, and useful content I could offer. Separate evidence I gave you from assumptions. Propose 3 interview questions I can use to validate the assumptions. Ask me to review the description before using it for content. Preserve my chosen language.`,
angles:`Use ONLY my confirmed positioning, audience and voice from this conversation. If any are missing, ask me for them before generating. Ask for ONE topic if I have not supplied one. Generate 8 genuinely different content angles: problem, myth, how-to, opinion, comparison, real story, mistake and checklist. For each: name the audience's reason to care, give a concrete hook, and suggest a small useful takeaway. Avoid repeating the same idea in different words. Do not invent personal experiences, client outcomes, statistics or quotes. Mark any angle needing evidence. Ask me to choose 3, then help me choose ONE to draft. Preserve my preferred language and voice.`,
loop:`Run a small content improvement loop with me. Use my confirmed positioning, audience, voice and selected angle; ask for anything missing. Step 1: create ONE short draft for the platform and language I specify. Do not invent stories, claims, quotes or results. Step 2: evaluate it against 4 criteria: specific and useful to the audience, recognizable in my actual voice, grounded in facts I supplied, and focused on one clear takeaway. Show the exact weak phrase and a practical correction for each issue; do not just assign a score. Step 3: make ONE revised version, preserving my meaning. Show what changed and any unresolved evidence gaps. Stop after that revision and ask for my approval. Never publish or send it anywhere.`,
brief:`Create a reusable Personal Brand Context Brief from this conversation. Include only confirmed positioning, audience, voice rules, supported experience/examples, content criteria, current goal and next action. Separate assumptions and open questions. Exclude private or sensitive details that are unnecessary for writing content. Do not invent facts and do not assume this will be automatically remembered in a future chat. Give me a compact, editable brief I can save myself, with today's date if known; otherwise ask for it. Ask me to verify and correct it before reusing it.`,
memory:`Review the Personal Brand Context Brief I provide. Sort proposed changes into KEEP (still accurate and useful), UPDATE (a correction or changed goal), and REMOVE (outdated, unsupported or unnecessary private context). Do not overwrite confirmed facts without explaining the evidence. Ask me to resolve contradictions. Return a revised compact brief plus a short change log and date. Treat this as a manual review method, not proof of automatic memory in any product.`};
const task=(action,time,output)=>'<div class="task-strip"><div><small>DO THIS</small><span>'+action+'</span></div><div><small>TIME</small><span>'+time+'</span></div><div><small>LEAVE WITH</small><span>'+output+'</span></div></div>';
const slides=[
{title:'Create more. Stay you.',theme:'cover',cover:true,chapter:'THE OPENING'},
{title:'Content is easy. Being remembered is harder.',theme:'dark',chapter:'THE PROBLEM',tag:'START HERE',kicker:'A GOOD POST IS NOT ALWAYS YOUR POST',heading:'More content.<br>But whose <em>voice?</em>',body:`<div class="duo"><div><div class="panel-label"><span>ANYONE COULD SAY THIS</span>${I('loop')}</div><div class="illustration"><div class="post ghost"></div><div class="post solid"><div class="post-header"><span class="post-avatar">${I('spark')}</span>ANOTHER PERFECT POST</div><p>“Unlock your potential.<br>Elevate your brand.”</p><small>Polished words. No lived experience.</small></div></div></div><div><div class="panel-label"><span>ONLY YOU COULD START HERE</span>${I('mic')}</div><div class="post"><div class="post-header"><span class="post-avatar">${I('person')}</span>A REAL MOMENT</div><p>“One thing I changed<br>after my last project…”</p><small>Your experience gives the story a reason to exist.</small></div></div></div>`,note:'Quick show of hands: have you ever received an AI draft that did not sound like you?'},
{title:'What you will build',theme:'dark',chapter:'THE JOURNEY',tag:'THE OUTCOME',kicker:'ONE CONNECTED SYSTEM',heading:'Start with you.<br>Leave with a <em>system.</em>',body:`<div class="diagram">${node('target','Positioning','Who you help. What changes.',0)}<span class="connector">→</span>${node('people','Audience','A person with a real need.',1)}<span class="connector">→</span>${node('fork','Angles','Different reasons to care.',2)}<span class="connector">→</span>${node('loop','Content loop','Draft. Review. Improve.',3)}<span class="connector">→</span>${node('file','Context brief','Useful context to carry forward.',4)}</div>`,note:'Your outputs: a positioning draft, one improved post, and a reusable context brief.'},
{title:'Find your starting point',theme:'paper',chapter:'01 / DISCOVER YOUR BRAND',tag:'YOUR TURN',kicker:'BEFORE YOU OPEN AI',heading:'Your identity starts<br>with <em>real answers.</em>',body:`<div class="identity-grid"><div class="identity-piece" style="--i:0">${I('pen')}<h3>Your skill.</h3><p>What can you actually do?<br>Name one concrete example.</p></div><div class="identity-piece" style="--i:1">${I('people')}<h3>Your people.</h3><p>Who could benefit?<br>Choose one specific audience.</p></div><div class="identity-piece" style="--i:2">${I('target')}<h3>Their problem.</h3><p>What gets in their way?<br>Name something you understand.</p></div></div>${task("Write before you open AI","1 min","1 skill + 1 audience + 1 problem")}${timer(60)}`,note:'Write a first answer for each. You can refine it later.'},
{title:'Rammah: the reference was not the identity',theme:'dark',chapter:'01 / RAMMAH · THE START',tag:'REAL PROJECT · 1 / 3',kicker:'A REFERENCE. THREE ATTEMPTS.',heading:'Three demos.<br>Still not <em>him.</em>',body:`<div class="diagram">${node('eye','The reference','A clear visual direction supplied by the client.',0)}<span class="connector">→</span>${node('loop','Three demos','Close to the reference. Still no connection.',1)}<span class="connector">→</span>${node('question','The missing piece','What makes this person different?',2)}</div>`,note:'Project story recalled by Mekky. Earlier demos have not yet been matched to verified screenshots.'},
{title:'Rammah: the discovery',theme:'dark',chapter:'01 / RAMMAH · THE DISCOVERY',tag:'REAL PROJECT · 2 / 3',kicker:'THE TURNING POINT WAS THE CONVERSATION',heading:'Understand the person.<br>Find the <em>connection.</em>',body:`<div class="diagram">${node('steps','Computer engineer','A background in understanding systems.',0)}<span class="connector">+</span>${node('people','Coach + trainer','Work centered on people and patterns.',1)}<span class="connector">→</span>${node('light','One coherent identity','Systems thinking meets his coaching work.',2)}</div>`,note:'Mekky’s design interpretation of the career journey he learned about in the conversation.'},
{title:'Rammah: the homepage connection',theme:'dark',chapter:'01 / RAMMAH · THE RESULT',evidence:true},
{title:'Let AI interview you',theme:'dark',chapter:'01 / DISCOVER YOUR BRAND',tag:'LIVE DEMO',kicker:'DISCOVER FIRST. WRITE SECOND.',heading:'Let AI ask.<br>Let <em>you</em> answer.',prompt:'interview',body:`<div class="duo"><div class="chat-window"><div class="chat-top"><i></i><i></i><i></i></div><div class="bubble"><small>AI ASKS</small>Tell me about something you have actually helped someone do.</div><div class="bubble answer"><small>YOU ANSWER</small>A real project. A useful skill. A specific moment.</div><div class="bubble"><small>AI FOLLOWS UP</small>Who benefited, and what changed?</div></div><div class="chat-side">${I('message')}<h3>Your experience.<br>Better questions.</h3><p>Answer one question at a time.<br>Correct the positioning it suggests.</p></div></div>`,note:'Use the copy icon or press C for the interview prompt. The prompt stays off the slide.'},
{title:'Give it your voice',theme:'dark',chapter:'01 / YOUR VOICE',tag:'YOUR TURN',kicker:'REAL EXPERIENCE. A REAL POINT OF VIEW.',heading:'Give AI something<br><em>only you can bring.</em>',prompt:'voice',body:'<div class="identity-grid"><div class="voice-object">'+I('clock','accent')+'<h3>A MOMENT</h3><p>Three demos.<br>Still not him.</p><small>From Mekky’s account of the Rammah project.</small></div><div class="voice-object">'+I('flag','accent')+'<h3>A POINT OF VIEW</h3><p>The problem<br>decides the solution.</p><small>Mekky’s stated working principle.</small></div><div class="voice-object">'+I('mic','accent')+'<h3>YOUR WORDS</h3><p>How would you tell<br>a colleague this story?</p><small>Use your actual phrasing. Keep it natural.</small></div></div>'+task('Write from your own experience','2 min','1 real moment + 1 opinion + 1 natural sentence'),note:'Pick one lived moment, one opinion, and one sentence in your natural voice.'},
{title:'Create for a person',theme:'dark',chapter:'02 / YOUR AUDIENCE',tag:'YOUR TURN',kicker:'AN AUDIENCE HYPOTHESIS FOR MEKKY’S CONTENT',heading:'Who needs<br><em>this story?</em>',prompt:'persona',body:'<div class="duo"><div class="persona"><div class="avatar-art">'+I('person')+'</div><div><p class="kicker">EXAMPLE AUDIENCE FOR THIS POST</p><h3>A coach building<br>a personal website.</h3><p>Wants a site that expresses their work and identity.</p></div></div><div class="need-list"><div class="need">'+I('target')+'<div><small>WANTS</small><p>A website they can recognize themselves in.</p></div></div><div class="need">'+I('question')+'<div><small>IS UNSURE ABOUT</small><p>How to explain what makes them different.</p></div></div><div class="need">'+I('light')+'<div><small>COULD USE</small><p>Questions to answer before choosing a reference.</p></div></div></div></div>'+task('Describe one person you could help','2 min','1 audience + 1 problem + 1 useful question'),note:'Audience hypothesis: validate it with real people. This does not describe Rammah’s customer research.'},
{title:'One story, five reasons to care',theme:'dark',chapter:'03 / MULTIPLY YOUR IDEAS',tag:'THE ANGLE MAP',kicker:'THE RAMMAH STORY BECOMES YOUR CONTENT',heading:'Same experience.<br><em>Different reasons to care.</em>',body:'<div class="radial"><div class="angle-column"><div class="angle" style="--i:0">'+I('question')+'<div><h3>Problem</h3><p>Why does the website look good but feel unlike you?</p></div></div><div class="angle" style="--i:1">'+I('bolt')+'<div><h3>Myth</h3><p>A perfect reference guarantees the right direction.</p></div></div><div class="angle" style="--i:2">'+I('steps')+'<div><h3>How-to</h3><p>Questions to ask before the first design.</p></div></div></div><div class="seed">'+I('person')+'<p>A website<br>that feels<br>like you.</p></div><div class="angle-column"><div class="angle" style="--i:3">'+I('flag')+'<div><h3>Opinion</h3><p>Understanding the person comes before choosing the look.</p></div></div><div class="angle" style="--i:4">'+I('message')+'<div><h3>Real story</h3><p>What changed after the conversation with Rammah?</p></div></div></div></div>',note:'These are proposed content angles drawn from Mekky’s account, not additional client outcomes.'},
{title:'Choose three angles',theme:'paper',chapter:'03 / YOUR CONTENT ANGLES',tag:'YOUR TURN',kicker:'EIGHT POSSIBILITIES. ONE STARTING POINT.',heading:'Generate eight.<br>Choose three. <em>Start with one.</em>',prompt:'angles',body:'<div class="angle-grid">'+[['question','The problem'],['bolt','The myth'],['steps','The how-to'],['flag','Your opinion'],['compare','The comparison'],['message','A real story'],['eye','A common mistake'],['check','A useful checklist']].map(([icon,label])=>'<div class="angle-tile">'+I(icon)+'<span>'+label+'</span></div>').join('')+'</div>'+task('Use your topic + audience + voice','3 min','8 angles → 3 choices → 1 angle to draft'),note:'Participants make their choices in their own chat or notes. No presenter selection is required.'},
{title:'From a prompt to a repeatable loop',theme:'dark',chapter:'04 / BUILD YOUR LOOP',tag:'THE PROCESS',kicker:'GIVE THE PROCESS A STANDARD AND A STOP',heading:'One request is a start.<br>A <em>loop</em> makes it useful.',body:`<div class="loop-diagram">${node('file','Context','Who you are. Who it is for.',0)}${node('pen','Draft','One angle. One clear takeaway.',1)}${node('eye','Review','Find specific weaknesses.',2)}${node('loop','Improve','Fix them. Compare. Approve.',3)}</div><div class="loop-return"><span>FEEDBACK → ONE REVISION → HUMAN APPROVAL</span></div>`,note:'You can run this manually in a chat. It is not automatically an autonomous agent.'},
{title:'The first draft',theme:'dark',chapter:'04 / THE CONTENT LOOP',tag:'DRAFT · 1 / 3',kicker:'OUR CHOSEN ANGLE: THE REFERENCE IS NOT ENOUGH',heading:'A polished draft.<br>Still <em>too general.</em>',prompt:'loop',body:'<div class="post-frame"><div class="post-header"><span class="post-avatar">'+I('pen')+'</span>ILLUSTRATIVE FIRST DRAFT</div><blockquote>Your website should reflect your personal brand. Choose a unique design that helps you stand out and connect with your audience.</blockquote><div class="draft-question">'+I('question')+'What could anyone else have written?</div></div>',note:'Demonstration copy, not a verified live AI response. Invite the audience to notice the weak phrases.'},
{title:'Review the weak phrases',theme:'dark',chapter:'04 / THE CONTENT LOOP',tag:'REVIEW · 2 / 3',kicker:'POINT TO THE PHRASE. EXPLAIN THE PROBLEM.',heading:'Make the review<br><em>specific.</em>',body:'<div class="review-layout"><div class="post-frame"><blockquote>Your website should <mark>reflect your personal brand.</mark> Choose a <mark>unique design</mark> that helps you <mark>stand out.</mark></blockquote></div><div class="review-list"><div><span>01</span><p>No real moment.<small>Where is the Rammah experience?</small></p></div><div><span>02</span><p>No clear difference.<small>What did the conversation change?</small></p></div><div><span>03</span><p>No useful next step.<small>What can the reader try?</small></p></div></div></div>',note:'Review against usefulness, recognizable voice, grounded claims and one clear takeaway.'},
{title:'The improved draft',theme:'dark',chapter:'04 / THE CONTENT LOOP',tag:'REVISION · 3 / 3',kicker:'SAME IDEA. REAL EXPERIENCE. A PRACTICAL TAKEAWAY.',heading:'Now the story<br><em>has a reason to exist.</em>',body:'<div class="post-frame improved-post"><div class="post-header"><span class="post-avatar">'+I('check')+'</span>PROPOSED POST · BASED ON MEKKY’S ACCOUNT</div><blockquote>With Ahmed Rammah, three demos followed the reference but did not connect. The direction changed when I explored his journey from computer engineering into coaching.<br><br>Before choosing a visual reference, ask: <em>what part of your journey should your website express?</em></blockquote><div class="post-traits"><span>'+I('clock')+'Real moment</span><span>'+I('light')+'A clear lesson</span><span>'+I('target')+'One next step</span></div></div>',note:'Proposed wording for Mekky to review. No invented results, client quotes or commercial metrics.'},
{title:'Four checks before you keep it',theme:'dark',chapter:'04 / CONTENT CRITERIA',tag:'THE REVIEW LENS',kicker:'GOOD ENOUGH NEEDS A DEFINITION',heading:'Keep the draft<br>that passes <em>these.</em>',body:`<div class="criteria">${[['target','Useful','Does it help a specific audience do or understand something?'],['mic','Recognizable','Would someone who knows you recognize the voice?'],['shield','Grounded','Are the experiences and claims supported by what you know?'],['eye','Clear','Is there one takeaway the reader can act on?']].map(([icon,title,text],i)=>`<div class="criterion" style="--i:${i}">${I(icon)}<h3>${title}</h3><p>${text}</p></div>`).join('')}</div>`,note:'Ask for the weak phrase and the correction. A score alone does not tell you what to improve.'},
{title:'Build your own loop',theme:'paper',chapter:'04 / BUILD AND TEST',tag:'12-MINUTE PRACTICE',kicker:'YOUR SKILL. YOUR AUDIENCE. YOUR VOICE.',heading:'Now make<br><em>one useful post.</em>',prompt:'loop',body:`<div class="loop-work"><div><div class="big-index">12<small>MINUTES</small></div><p class="sub" style="margin-top:25px">Keep the first draft.<br>You need it for the comparison.</p></div><div class="work-steps"><div class="work-step">${I('fork')}Choose one of your angles.</div><div class="work-step">${I('pen')}Generate a short draft.</div><div class="work-step">${I('eye')}Review with the four criteria.</div><div class="work-step">${I('compare')}Improve once. Compare both.</div></div></div>${task("Draft → review → improve once","12 min","2 versions + 1 reason for a change")}${timer(720)}`,note:'Finish with your judgment: what became more useful, and what still needs your input?'},
{title:'The context reset',theme:'dark',chapter:'05 / CARRY YOUR CONTEXT',tag:'THE RESET PROBLEM',kicker:'YOUR NEXT CHAT MAY NOT KNOW THIS WORK',heading:'New chat.<br><em>Same questions?</em>',body:`<div class="reset-bridge"><div class="chat-window"><div class="panel-label"><span>THIS SESSION</span>${I('brain')}</div><div class="lost"><span>My positioning</span><span>My audience</span><span>My voice</span><span>My decisions</span></div><p class="sub" style="margin-top:25px">Useful context<br>you already built.</p></div><span class="connector">→</span><div class="chat-window"><div class="panel-label"><span>A NEW CHAT WITHOUT CONTEXT</span>${I('message')}</div><div class="empty-context">${I('question')}<p>“Who is the content for?”</p></div></div></div>`,note:'What carries across depends on the tool and settings. Save a brief you can review and reuse yourself.'},
{title:'Create your context brief',theme:'paper',chapter:'05 / YOUR CONTEXT BRIEF',tag:'YOUR TURN',kicker:'SAVE THE DECISIONS YOU HAVE ACTUALLY CONFIRMED',heading:'Give the next chat<br>a better <em>starting point.</em>',prompt:'brief',body:'<div class="duo brief-duo"><div class="chat-side">'+I('file')+'<h3>Summarize.<br>Correct.<br>Save.</h3><p>Keep confirmed decisions.<br>Mark assumptions.<br>Leave out unnecessary private details.</p></div><div class="brief-sheet"><div class="sheet-top"><span>PERSONAL BRAND / CONTEXT BRIEF</span>'+I('file')+'</div><div class="brief-line"><span>IDENTITY</span><span>Artist. Digital Problem Solver. Strategist + Builder.</span></div><div class="brief-line"><span>PRINCIPLE</span><span>The problem decides the solution.</span></div><div class="brief-line"><span>AUDIENCE</span><span>Professionals seeking a site that reflects them · hypothesis.</span></div><div class="brief-line"><span>EXPERIENCE</span><span>Rammah: discovering the person changed the direction.</span></div><div class="brief-line"><span>NEXT ACTION</span><span>Review a post about choosing references.</span></div></div></div>'+task('Summarize → check → save your own brief','3 min','1 corrected context brief in your notes'),note:'Draft example from confirmed identity and the reported project story. The audience remains a hypothesis.'},
{title:'Dreaming Memory: review what carries forward',theme:'dark',chapter:'05 / DREAMING MEMORY',tag:'A REVIEW METHOD',kicker:'MY METHOD FOR KEEPING CONTEXT USEFUL',heading:'Keep what helps.<br><em>Revise what changed.</em>',prompt:'memory',body:`<div class="memory-bins"><div class="bin">${I('save')}<h3>Keep.</h3><div class="memory-slip">My confirmed voice.<small>Still true. Still useful.</small></div></div><div class="bin">${I('loop')}<h3>Update.</h3><div class="memory-slip">My current audience.<small>Changed? Review the evidence.</small></div></div><div class="bin">${I('trash')}<h3>Remove.</h3><div class="memory-slip">An old campaign goal.<small>Outdated or unnecessary.</small></div></div></div>`,note:'“Dreaming Memory” here names a context-review method, not an automatic feature shared by all AI products.'},
{title:'Your personal brand system',theme:'dark',chapter:'THE WHOLE SYSTEM',tag:'CONNECT THE PIECES',kicker:'EVERY STEP FEEDS THE NEXT',heading:'An identity.<br>A repeatable <em>practice.</em>',body:`<div class="system-rule"></div><div class="system-ring">${[['target','Positioning','The value you can offer.'],['people','Audience','The person you help.'],['fork','Angles','Reasons they will care.'],['loop','Content loop','A way to improve the draft.'],['file','Context','A brief you keep current.']].map(([icon,title,text],i)=>`<div class="system-stop" style="--i:${i}">${I(icon)}<h3>${title}</h3><p>${text}</p></div>`).join('')}</div>`,note:'The goal is not endless content. It is useful work that still sounds like you.'},
{title:'Your 24-hour challenge',theme:'orange',chapter:'YOUR NEXT MOVE',tag:'BEFORE YOU LEAVE',kicker:'MAKE ONE SMALL COMMITMENT',heading:'Choose your<br>next <em>real action.</em>',body:`<div class="challenge"><div class="huge">24<span>H</span></div><div class="challenge-options"><div class="challenge-option">${I('target')}Refine your positioning.</div><div class="challenge-option">${I('pen')}Finish one useful post.</div><div class="challenge-option">${I('people')}Validate one audience assumption.</div><div class="challenge-option">${I('file')}Save your corrected context brief.</div></div>${task("Write the action and when you will do it","1 min","1 next action + a specific time")}</div>`,note:'Write down what you will do and when. One completed action is enough to begin.'},

let notesChannel=null;try{if(typeof BroadcastChannel==='function')notesChannel=new BroadcastChannel('mekky-workshop-presenter')}catch{}
const deck=document.querySelector('.deck');const cover=document.querySelector('.cover').outerHTML;
deck.innerHTML=slides.map((s,i)=>{if(s.connect)return `<section class="slide connect-slide" aria-label="Keep going. Together." aria-hidden="true" inert><div class="connect-colour"></div>${head('THE NEXT CHAPTER','STAY CONNECTED')}<div class="connect-layout"><div class="connect-statement"><p class="connect-eyebrow">THIS IS JUST THE START.</p><h2>KEEP<br>GOING<span>.</span></h2><p class="connect-together">Better, together.</p><div class="connect-signoff"><span>YOUR IDEAS. YOUR VOICE.</span><span class="connect-arrow" aria-hidden="true">↗</span></div></div><div class="connect-destinations"><p class="connect-intro">TAKE YOUR NEXT STEP.</p><div class="connect-paths"><a class="connect-path" href="https://chat.whatsapp.com/KfGGUPQUtr9HUFh0b8MCZp" target="_blank" rel="noopener noreferrer"><div class="connect-label"><span>01 / LEARN WITH US</span>${I('people')}</div><img src="assets/qr-community.png" width="410" height="410" alt="QR للانضمام إلى كومينتي واتساب"><h3>COMMUNITY</h3><p lang="ar" dir="rtl">نكمّل ونتعلّم سوا.</p><span class="connect-link">JOIN ON WHATSAPP ↗</span></a><a class="connect-path" href="https://muhammedmekky.com/book/mentorship-discovery-session" target="_blank" rel="noopener noreferrer"><div class="connect-label"><span>02 / BUILD WITH ME</span>${I('target')}</div><img src="assets/qr-mentorship.png" width="410" height="410" alt="QR لحجز جلسة تعارف للمينتور شيب"><h3>MENTORSHIP</h3><p lang="ar" dir="rtl">خطوتك الجاية، بوضوح.</p><span class="connect-link">BOOK A DISCOVERY CALL ↗</span></a></div><p class="connect-scan">SCAN TO CONNECT <span>—</span> OR TAP YOUR NEXT STEP</p></div></div></section>`;if(s.cover)return cover;if(s.evidence)return `<section class="slide evidence-slide dark" aria-label="${s.title}" aria-hidden="true" inert>${head(s.chapter,'REAL PROJECT · 3 / 3')}<div class="case-evidence"><img src="assets/rammah-homepage.webp" alt="Actual Rammah homepage hero detail: Engineer, Systematizer, Trainer, Coach; a systems-and-code metaphor connects engineering with coaching"></div><p class="evidence-caption">THE CONNECTION, MADE VISIBLE. <span>Archived homepage · hero detail</span></p></section>`;if(s.closing)return `<section class="slide cover closing" aria-label="Closing" aria-hidden="true" inert><img class="portrait" src="assets/mekky-reference-portrait-v2.png" alt="Orange-lit portrait of Mekky">${head('AI-POWERED PERSONAL BRANDING','THANK YOU',true)}<div class="closing-content"><p class="eyebrow reveal">YOUR IDEAS. YOUR VOICE. AMPLIFIED.</p><h2 class="closing-title reveal delay">CREATE MORE.<br>STAY YOU.</h2><p class="sub reveal delay2">Build systems that amplify<br>what makes you, you.</p><p class="byline reveal delay2">Muhammed Mekky<br><span class="muted">Artist. Digital Problem Solver. Strategist + Builder.</span></p></div></section>`;return `<section class="slide visual ${s.theme}" aria-label="${s.title}" aria-hidden="true" inert>${head(s.chapter,s.tag)}<div class="canvas"><p class="kicker reveal">${s.kicker}</p><h2 class="title reveal delay">${s.heading}</h2><div class="reveal delay2">${s.body}</div></div></section>`}).join('')+`<nav class="controls" aria-label="Slide navigation"><div class="progress"></div><div class="page-indicator"><span class="counter"><b id="current">01</b><span> / ${slides.length}</span></span><input class="jump" type="number" min="1" max="${slides.length}" aria-label="Go to slide number" placeholder="↗" title="Enter slide number and press Enter"></div><span class="nav-label">THE OPENING</span><div class="arrows"><button class="copy-prompt" type="button" aria-label="Copy presenter prompt" title="Copy prompt (C)" hidden>${I('copy')}</button><button class="fullscreen" type="button" aria-label="Toggle fullscreen" title="Fullscreen (F)">⛶</button><button id="prev" type="button" aria-label="Previous slide" disabled>←</button><button id="next" type="button" aria-label="Next slide">→</button></div></nav><div class="stage-status" role="status" aria-live="polite"></div>`;
document.querySelector('.status')?.remove();const sections=[...deck.querySelectorAll('.slide')];let active=0,toastTimeout;const status=deck.querySelector('.stage-status');const timers=new Map();
function toast(text){status.textContent=text;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>status.textContent='',2400)}
function stopTimer(section){const button=section.querySelector('.timer-toggle');if(!button)return;const state=timers.get(button);if(state?.interval){clearInterval(state.interval);state.interval=null;button.querySelector('span').textContent='Resume timer'}}
function go(index){if(index<0||index>=slides.length)return;stopTimer(sections[active]);active=index;sections.forEach((section,i)=>{section.classList.toggle('active',i===index);section.setAttribute('aria-hidden',String(i!==index));section.inert=i!==index});deck.dataset.slide=index;deck.dataset.theme=slides[index].theme;deck.style.color=slides[index].theme==='paper'||slides[index].theme==='orange'?'var(--ink)':'var(--paper)';deck.style.setProperty('--progress',((index+1)/slides.length*100)+'%');document.getElementById('current').textContent=String(index+1).padStart(2,'0');document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===slides.length-1;deck.querySelector('.nav-label').textContent=slides[index].chapter;deck.querySelector('.copy-prompt').hidden=!slides[index].prompt;document.title=`MEKKY — ${String(index+1).padStart(2,'0')} / ${slides.length} · ${slides[index].title}`;status.textContent='';location.replace('#slide-'+(index+1));notesChannel?.postMessage({slide:index+1})}
async function copyPrompt(){const text=prompts[slides[active].prompt];if(!text)return;try{if(!navigator.clipboard?.writeText)throw new Error('Clipboard unavailable');await navigator.clipboard.writeText(text);toast('Prompt copied ✓')}catch{const previouslyFocused=document.activeElement;const hidden=document.createElement('textarea');hidden.value=text;hidden.setAttribute('aria-hidden','true');hidden.style.cssText='position:fixed;left:-10000px;top:0;width:1px;height:1px;opacity:0';document.body.append(hidden);hidden.select();let copied=false;try{copied=document.execCommand('copy')}catch{}hidden.remove();previouslyFocused?.focus({preventScroll:true});toast(copied?'Prompt copied ✓':'Copy blocked. Allow clipboard access in your browser.')}}
document.querySelector('.copy-prompt').onclick=copyPrompt;document.getElementById('prev').onclick=()=>go(active-1);document.getElementById('next').onclick=()=>go(active+1);
document.querySelector('.jump').addEventListener('keydown',e=>{if(e.key==='Enter'){const value=Number(e.target.value);if(Number.isInteger(value)&&value>=1&&value<=slides.length){go(value-1);e.target.value='';e.target.blur()}else toast(`Choose a slide from 1 to ${slides.length}.`)}});
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{toast('Use your browser fullscreen shortcut.')}}document.querySelector('.fullscreen').onclick=fullscreen;
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.target.matches('input,textarea,[contenteditable=true]'))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(active+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(active-1)}else if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();go(active+1)}else if(e.key.toLowerCase()==='c')copyPrompt();else if(e.key.toLowerCase()==='t'){const timer=sections[active].querySelector('.timer-toggle');if(timer)timer.click()}else if(e.key.toLowerCase()==='f')fullscreen();else if(e.key.toLowerCase()==='h')deck.classList.toggle('controls-hidden');else if(e.key==='Home')go(0);else if(e.key==='End')go(slides.length-1)});
document.querySelectorAll('.timer-toggle').forEach(button=>{const initial=Number(button.dataset.seconds);const display=button.parentElement.querySelector('.countdown');const state={remaining:initial,interval:null,end:0};timers.set(button,state);const render=()=>display.textContent=String(Math.floor(state.remaining/60)).padStart(2,'0')+':'+String(state.remaining%60).padStart(2,'0');button.onclick=()=>{if(state.interval){state.remaining=Math.max(0,Math.ceil((state.end-Date.now())/1000));clearInterval(state.interval);state.interval=null;button.querySelector('span').textContent='Resume timer';render();return}if(state.remaining===0)state.remaining=initial;state.end=Date.now()+state.remaining*1000;button.querySelector('span').textContent='Pause timer';render();state.interval=setInterval(()=>{state.remaining=Math.max(0,Math.ceil((state.end-Date.now())/1000));render();if(state.remaining===0){clearInterval(state.interval);state.interval=null;button.querySelector('span').textContent='Restart timer';toast('Time to share what you made.')}},250)}});
window.addEventListener('hashchange',()=>{const match=location.hash.match(/^#slide-(\d+)$/);if(match&&Number(match[1])-1!==active)go(Number(match[1])-1)});
const initialHash=location.hash.match(/^#slide-(\d+)$/);go(initialHash?Math.min(slides.length-1,Math.max(0,Number(initialHash[1])-1)):0);

</script></body></html>
